name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.ref }}".StartsWith("refs/tags/v")) { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0" }
          "value=$v" >> $env:GITHUB_OUTPUT
          "Version: $v"

      - name: Publish
        run: >
          dotnet publish src/Lyricat/Lyricat.csproj
          -c Release -o publish
          -p:Version=${{ steps.version.outputs.value }}

      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process publish\Lyricat.exe -ArgumentList "--selftest","selftest.txt" -PassThru -Wait
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "The .exe self-test failed" }

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=${{ steps.version.outputs.value }}" "/DSourceDir=..\publish" installer\Lyricat.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Copy-Item installer\output\Lyricat-Setup.exe publish\

      - name: Installer test
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\LyricatInstall"
          Start-Process publish\Lyricat-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir","/TASKS=" -Wait
          if (-not (Test-Path "$dir\Lyricat.exe")) { throw "The installer didn't install Lyricat.exe" }
          $p = Start-Process "$dir\Lyricat.exe" -ArgumentList "--selftest","installed.txt" -PassThru -Wait
          Get-Content installed.txt
          if ($p.ExitCode -ne 0) { throw "The installed .exe self-test failed" }
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\Lyricat.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\Lyricat.exe") { throw "The uninstaller left Lyricat.exe behind" }

      - name: Checksum
        shell: pwsh
        run: |
          foreach ($name in "Lyricat.exe", "Lyricat-Setup.exe") {
            $h = (Get-FileHash "publish\$name" -Algorithm SHA256).Hash.ToLower()
            "$h  $name" | Set-Content "publish\$name.sha256" -NoNewline
            "$name SHA256: $h"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Lyricat
          path: |
            publish/Lyricat.exe
            publish/Lyricat.exe.sha256
            publish/Lyricat-Setup.exe
            publish/Lyricat-Setup.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/Lyricat.exe
            publish/Lyricat.exe.sha256
            publish/Lyricat-Setup.exe
            publish/Lyricat-Setup.exe.sha256
          generate_release_notes: true
